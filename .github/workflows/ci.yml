name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy sentinel

  security:
    name: Security regression suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run security suite
        run: pytest -m security
        env:
          SENTINEL_REDIS_URL: redis://localhost:6379/0

  test:
    name: Tests (real Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run fast suite
        run: pytest -m "not slow" --cov=sentinel --cov-report=term-missing
        env:
          SENTINEL_REDIS_URL: redis://localhost:6379/0

  slow:
    name: Concurrency & failure-injection suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run slow suite
        run: pytest -m slow
        env:
          SENTINEL_REDIS_URL: redis://localhost:6379/0

  packaging:
    name: Packaging (build, twine check, wheel smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build wheel and sdist
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install wheel in fresh venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
      - name: Import Sentinel from installed wheel and resolve Lua resources
        run: |
          /tmp/wheel-venv/bin/python - <<'EOF'
          import importlib.resources
          import sentinel
          import sentinel.lua
          import sentinel.http
          for name in ("lua/token_bucket.lua", "lua/sliding_window.lua"):
              path = importlib.resources.files("sentinel").joinpath(name)
              assert path.is_file(), name
          print(f"wheel smoke OK: sentinel {sentinel.__version__}")
          EOF
