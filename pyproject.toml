[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-rate-limiter"
version = "1.0.1"
description = "Application-aware, tenant-aware, distributed rate limiting library"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "rate-limiting",
    "fastapi",
    "redis",
    "lua",
    "token-bucket",
    "sliding-window",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "redis>=5.0",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "PyJWT>=2.8,<3",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/KanavSingla28-k/Sentinel"
Source = "https://github.com/KanavSingla28-k/Sentinel"
Documentation = "https://github.com/KanavSingla28-k/Sentinel/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff==0.16.2",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5",
]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["py.typed", "lua/*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: slow suite run in a separate CI job (Phase 13)",
    "security: security regression tests (Phase 11)",
    "integration: requires a reachable real Redis instance",
]

[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sentinel", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
