<svg viewBox="0 0 900 700" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Failure handling decision tree from Redis call through circuit breaker to fail-open or fail-closed outcomes">
  <defs>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4472C4"/></marker>
  </defs>
  <line x1="450" y1="90" x2="210" y2="170" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="450" y1="90" x2="700" y2="170" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="210" y1="240" x2="210" y2="320" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="700" y1="240" x2="700" y2="320" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="700" y1="410" x2="570" y2="470" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="700" y1="410" x2="780" y2="470" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="570" y1="550" x2="580" y2="590" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>
  <line x1="780" y1="550" x2="790" y2="590" stroke="#4472C4" stroke-width="1.4" marker-end="url(#ah3)"/>

  <rect x="350" y="20" width="200" height="70" rx="3" fill="#F3F7FA" stroke="#4472C4"/>
  <text x="450" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#0A2A43">REDIS CALL</text>
  <text x="450" y="72" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">on the critical path</text>

  <rect x="100" y="170" width="220" height="70" rx="3" fill="#EAF6F0" stroke="#2F8F6B"/>
  <text x="210" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#2F8F6B">HEALTHY</text>
  <text x="210" y="220" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">atomic Lua executes</text>

  <rect x="560" y="170" width="280" height="70" rx="3" fill="#FBF1DF" stroke="#C97B15"/>
  <text x="700" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#C97B15">FAILED / TIMEOUT</text>
  <text x="700" y="220" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">or breaker already open</text>

  <rect x="90" y="320" width="240" height="90" rx="3" fill="#F3F7FA" stroke="#4472C4"/>
  <text x="210" y="358" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#0A2A43">DISTRIBUTED LIMITER</text>
  <text x="210" y="380" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">Lua returns allow / deny</text>

  <rect x="560" y="320" width="280" height="90" rx="3" fill="#FBF1DF" stroke="#C97B15"/>
  <text x="700" y="352" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#0A2A43">CIRCUIT BREAKER: OPEN</text>
  <text x="700" y="374" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">per-process, not shared</text>
  <text x="700" y="392" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">across instances</text>

  <rect x="470" y="470" width="200" height="80" rx="3" fill="#F3F7FA" stroke="#4472C4"/>
  <text x="570" y="502" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#0A2A43">FAIL-OPEN</text>
  <text x="570" y="520" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">Resumint — UX first</text>

  <rect x="680" y="470" width="200" height="80" rx="3" fill="#F3F7FA" stroke="#4472C4"/>
  <text x="780" y="502" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#0A2A43">FAIL-CLOSED</text>
  <text x="780" y="520" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">PDFTalk — abuse-protection first</text>

  <rect x="460" y="590" width="240" height="90" rx="3" fill="#EAF6F0" stroke="#2F8F6B"/>
  <text x="580" y="622" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#2F8F6B">EMERGENCY LIMITER</text>
  <text x="580" y="644" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">blast-radius cap only</text>
  <text x="580" y="660" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">e.g. 2 req/sec, in-memory</text>

  <rect x="700" y="590" width="180" height="90" rx="3" fill="#FBEAE8" stroke="#C0392B"/>
  <text x="790" y="622" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#C0392B">DENY — 503</text>
  <text x="790" y="644" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">decision_reason</text>
  <text x="790" y="660" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">logged</text>
</svg>