<svg viewBox="0 0 900 260" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of the Redis key format with four labeled segments">
  <rect x="60" y="60" width="140" height="60" rx="3" fill="#F3F7FA" stroke="#4472C4"/>
  <text x="130" y="95" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#0A2A43">sentinel:v1:</text>

  <rect x="210" y="60" width="200" height="60" rx="3" fill="#FBF1DF" stroke="#C97B15"/>
  <text x="310" y="95" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#0A2A43">{tenant_hash}</text>

  <rect x="420" y="60" width="220" height="60" rx="3" fill="#F3F7FA" stroke="#4472C4"/>
  <text x="530" y="95" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#0A2A43">{endpoint_id}</text>

  <rect x="650" y="60" width="190" height="60" rx="3" fill="#EAF6F0" stroke="#2F8F6B"/>
  <text x="745" y="95" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#0A2A43">{policy_version}</text>

  <line x1="130" y1="120" x2="130" y2="160" stroke="#4472C4" stroke-width="1.4"/>
  <text x="130" y="176" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">fixed, versioned</text>
  <text x="130" y="190" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">prefix</text>

  <line x1="310" y1="120" x2="310" y2="160" stroke="#4472C4" stroke-width="1.4"/>
  <text x="310" y="176" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">SHA-256–derived,</text>
  <text x="310" y="190" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">collision-resistant</text>

  <line x1="530" y1="120" x2="530" y2="160" stroke="#4472C4" stroke-width="1.4"/>
  <text x="530" y="176" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">explicit logical id —</text>
  <text x="530" y="190" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">never a raw URL</text>

  <line x1="745" y1="120" x2="745" y2="160" stroke="#4472C4" stroke-width="1.4"/>
  <text x="745" y="176" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">bumped only on</text>
  <text x="745" y="190" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5B7A99">semantic policy change</text>
</svg>
